# akiya-watch 監視対象定義（マスタ）
# status: verified = URL実在確認済み / derived = 導出（初回実行で要検証）
# channel: ①公開ポータル ②公的誘導 ③業者内流通 ④個人掲示板 ⑤強制換価 ⑥公有財産
# kind: 主な対象種別。filter_keywords: 県・郡ページから対象市町だけ抽出するキーワード
# 注意: URLは唯一のマスタ。記憶・推測で生成・修正しない（CLAUDE.md 恒久ルール）

# ============================================================================
# 適合判定パラメータ（このブロックが唯一の定義元。watch.py へのコード直書き禁止）
# ----------------------------------------------------------------------------
#   price_max_man         : 旧・全種別共通の価格上限（後方互換。種別別が優先）
#   area_min_sqm          : 適合とみなす土地面積の下限。単位=㎡（維持）
#   price_ceiling_by_type : 種別ごとの価格上限（万円）。適合判定に使用・画面で可変
#   exclude_areas         : 所在地一致で既定除外するNGエリア（別荘地）。ハード除外は
#                           せず、HTMLのトグル既定ONで隠す。除外ログ(監査)に残す
#   exclude_keywords      : 空（建築可否では機械除外しない）
#   caution_keywords      : 注意フラグ（除外しない。画面でキーワード除外トグル可）
#   interest_keywords     : 本命シグナル（除外しない・注目印）
# ============================================================================
filters:
  price_max_man: 1000
  area_min_sqm: 330
  # ---- キャンプ場土地タブ（tab: camp のサイトに適用。ベース値を上書きマージ）----
  #   2号店用の広い山物件。沼津IC起点で車1h圏＋価値ある飛び地（2026-09-05再定義。市町一覧は
  #   下記 tiers）。面積下限1,000㎡・価格上限3,000万。
  camp:
    price_max_man: 3000
    area_min_sqm: 1000
    price_ceiling_by_type:
      更地: 3000
      古家付き土地: 3000
      中古戸建: 3000
      空き家: 3000
    # ---- 対象市町の正本（2026-09-05・消込表#472で再定義。tiersは watch.py の
    #   filter_keywords: "@camp_tiers" 展開／_MACHI_NAMES 組み立ての唯一の定義元） ----
    #   沼津IC起点・NAVITIME深夜実測(0:15-0:50出発、渋滞なし自由流)・各市町役所/役場までの
    #   所要時間。「役所まで」の時間であり山林物件がある山側はここから+10〜30分見込む
    #   （日中はさらに延びる）。出典・実測値: docs/research/20260905_camp_sites_candidates.md Part1。
    #   tier1=60分以内、tier2=60〜90分、tobichi=90分超だが指定で残す（ネームバリュー）。
    tiers:
      tier1:   # ≤60分
        [沼津市, 三島市, 函南町, 長泉町, 清水町, 裾野市, 御殿場市, 小山町, 伊豆の国市, 伊豆市, 熱海市,
         富士市, 富士宮市, 箱根町, 湯河原町, 真鶴町, 静岡市清水区, 静岡市葵区, 静岡市駿河区, 焼津市,
         小田原市, 南足柄市, 秦野市, 山北町, 松田町, 開成町, 大井町, 中井町,
         山中湖村, 忍野村, 富士吉田市, 富士河口湖町, 鳴沢村, 西桂町]
      # 伊東市は実測68分でtier2（市役所基準。伊豆高原等の南部はさらに遠い＝未実測）。
      # 下田市は深夜実測85分（tier1境界に近い）だが、静岡県資料は伊豆縦貫道整備前150分と
      # 記載＝日中の実勢は2時間超もありうる。ネームバリューを優先しtier2に置く（tobichi化しない）。
      tier2:   # 60〜90分
        [藤枝市, 伊東市, 河津町, 身延町, 南部町, 富士川町, 下田市, 東伊豆町, 西伊豆町, 松崎町]
      tobichi: # 90分超だが指定で残す（ネームバリュー）
        [南伊豆町]
  # ---- 賃貸タブ（tab: rent のサイトに適用。ベース値を上書きマージ）----
  #   静岡県東部（函南町=丹那の友人拠点から通える範囲）向け。月額家賃の上限で判定する
  #   （面積は問わない）。賃貸タブは exclude_areas（別荘地除外）を適用しない
  #   （別荘地の激安賃貸が狙い目のため。watch.py の passFilters 参照）。
  rent:
    price_max_man: 5          # 月額家賃の上限（万円）。適合＝これ以下
    area_min_sqm: 0           # 賃貸は面積下限なし
    price_ceiling_by_type:
      賃貸戸建: 5
      賃貸アパート: 5
      賃貸マンション: 5
      賃貸その他: 5
      # 駐車場は住居ではないので画面では既定非表示（種別フィルタで出せる）
      駐車場: 5
    # 売買用の注意/本命キーワードとNGエリアは賃貸に持ち込まない（意味が違う）:
    #   管理費・別荘地・温泉は賃貸では当たり前 or 狙い目。市街化調整区域等は賃貸で無意味。
    #   別荘地(エメラルドタウン/南箱根ダイヤランド等)は賃貸では除外対象ではなく本命。
    exclude_areas: []
    caution_keywords: [事務所, 店舗, 事業用, 駐車場のみ, 高齢者専用, women, 女性限定, 学生限定, 法人契約のみ]
    interest_keywords: [敷金なし, 敷金無, 礼金なし, 礼金無, ペット可, 駐車場付, 駐車場2台, 庭付, 平屋, 古民家, 戸建, DIY可, 事務所可]
    interest_groups: {}   # 賃貸は地区グループを継承しない（既存のrent上書き方式に合わせる。2026-09-05）
  price_ceiling_by_type:
    更地: 1500
    古家付き土地: 1500
    中古戸建: 3000
    空き家: 3000
  exclude_areas: [南箱根ダイヤランド, パサディナタウン, 東大場, エメラルドタウン, 富士見ニュータウン]
  exclude_keywords: []
  caution_keywords: [再建築不可, 要相談, 調査中, 農地転用, 既存不適格, 崖条例, 別荘地, 管理費, 借地, 定期借地, 青地, 農振, 温泉]
  interest_keywords: [既存宅地, 線引き前宅地, 市街化調整区域, 調整区域, 34条11号, 34条12号, 43条, 再建築可, 建替可, 適合証明, 白地, 無指定]
  # 地区グループ: 「市町 + 大字」で一致したら参考情報列にグループ名のバッジ（本命=緑）を付ける。
  # 大字だけの一致にしない（「神山」は箱根町にも、「東山」は熱海市にもある）。
  # 出典・実測: docs/research/20260905_hakone_west_oaza_and_sites.md Part1（郵便番号一覧94大字×地理院標高APIで斜面向きを実測）
  # camp/home(未指定)は本ブロックを継承する。rentは上のrent:ブロックで interest_groups: {} を
  # 明示指定して継承しない（filters.rentは既存キーもすべて明示上書きする方式のため揃えた）。
  interest_groups:
    外輪山西麓:   # 箱根外輪山の西側・北西側斜面。一次圏8＋二次圏で西向き/別荘地帯のもの
      御殿場市: [深沢, 東田中, 二子, 東山, 二の岡, 神山, 沼田, 萩蕪, 大坂]
      裾野市: [茶畑, 深良, 久根]
      小山町: [竹之下, 新柴, 桑木, 中島]

