    filter_keywords: "@camp_tiers"
    note: "2026-09-05実測 HTTP 200(http限定・robots.txt無し=404によりrobots制限なし)。**table/tr構造が実質壊れており(5地区分の全データが単一<tr>内の434個の兄弟<td>に平坦化)、DOM構造でなくページ全文(NFKC正規化済み)をテキストパターンで再分割する方式(parse_asagiri)を採用**。地区マーカー(朝霧/西林/猪之頭/白糸地区・その他の地域)→物件種別マーカー(売土地/売別荘)の順に全文を分割し、面積は「土地NNN.NN」(坪→㎡はTSUBO_TO_SQM換算)、価格は面積系トークンを除去した残りの数値(万円の生数値。列見出しの単位のみに依存し行ごとの円/万円表記なし)を抽出。全5地区とも富士宮市（朝霧地区=富士宮市猪之頭、西林地区=富士宮市人穴、猪之頭地区=富士宮市猪之頭、白糸地区=富士宮市内野、その他の地域=価格直後に富士宮市猪之頭/内野等の所在地が個別記載）を実データ79件で確認(適合6件超を含む)。詳細URLが個別に無くathome.co.jpの地図リンクとの対応付けも崩れたtr構造から機械的にできないため、全件base_url固定(既知の制約)。"

